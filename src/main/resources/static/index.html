<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校圈 - 校园闲置平台</title>
    <!-- 引入 Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
        }
        .form-title {
            font-weight: 700;
            color: #198754;
            text-align: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <h2 class="text-center mb-4 text-dark fw-bold">校圈</h2>

    <!-- 注册区域 -->
    <div id="register-section">
        <div class="form-title">注册新账号</div>
        <div class="mb-3">
            <input type="text" class="form-control" id="reg-username" placeholder="请输入用户名">
        </div>
        <div class="mb-3">
            <input type="password" class="form-control" id="reg-password" placeholder="请输入密码">
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="reg-realname" placeholder="请输入真实姓名">
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="reg-studentid" placeholder="请输入学号">
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="reg-campus" placeholder="所在校区 (湖西 / 湖东)">
        </div>
        <button class="btn btn-success w-100 py-2" id="register-btn">注 册</button>
        <div id="reg-message" class="text-center mt-2 small"></div>
        <div class="text-center mt-3 small">已有账号？ <a href="#" id="show-login" class="text-success text-decoration-none fw-bold">去登录</a></div>
    </div>

    <!-- 登录区域 -->
    <div id="login-section" style="display: none;">
        <div class="form-title">登录系统</div>
        <div class="mb-3">
            <input type="text" class="form-control" id="login-username" placeholder="请输入用户名">
        </div>
        <div class="mb-3">
            <input type="password" class="form-control" id="login-password" placeholder="请输入密码">
        </div>
        <button class="btn btn-success w-100 py-2" id="login-btn">登 录</button>
        <div id="login-message" class="text-center mt-2 small"></div>
        <div class="text-center mt-3 small">还没有账号？ <a href="#" id="show-register" class="text-success text-decoration-none fw-bold">去注册</a></div>
    </div>
</div>

<script>
    // JS 逻辑与原版完全一致，直接复制
    const registerSection = document.getElementById('register-section');
    const loginSection = document.getElementById('login-section');
    const showLogin = document.getElementById('show-login');
    const showRegister = document.getElementById('show-register');

    showLogin.addEventListener('click', (e) => { e.preventDefault(); registerSection.style.display = 'none'; loginSection.style.display = 'block'; });
    showRegister.addEventListener('click', (e) => { e.preventDefault(); loginSection.style.display = 'none'; registerSection.style.display = 'block'; });

    const registerBtn = document.getElementById('register-btn');
    const regMessage = document.getElementById('reg-message');
    registerBtn.addEventListener('click', async () => {
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;
        const realName = document.getElementById('reg-realname').value.trim();
        const studentId = document.getElementById('reg-studentid').value.trim();
        const campus = document.getElementById('reg-campus').value.trim();
        if (!username || !password || !realName || !studentId || !campus) {
            regMessage.textContent = '请填写所有字段';
            regMessage.className = 'text-center mt-2 small text-danger';
            return;
        }
        const user = { username, password, realName, studentId, campus };
        try {
            const response = await fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });
            const text = await response.text();
            regMessage.textContent = text;
            regMessage.className = text === '注册成功' ? 'text-center mt-2 small text-success' : 'text-center mt-2 small text-danger';
            if (text === '注册成功') {
                setTimeout(() => { registerSection.style.display = 'none'; loginSection.style.display = 'block'; regMessage.textContent = ''; }, 1500);
            }
        } catch (error) {
            regMessage.textContent = '网络错误，请稍后重试';
            regMessage.className = 'text-center mt-2 small text-danger';
        }
    });

    const loginBtn = document.getElementById('login-btn');
    const loginMessage = document.getElementById('login-message');
    loginBtn.addEventListener('click', async () => {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username || !password) {
            loginMessage.textContent = '请输入用户名和密码';
            loginMessage.className = 'text-center mt-2 small text-danger';
            return;
        }
        try {
            const response = await fetch(`/api/user/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, {
                method: 'POST'
            });
            const data = await response.json();
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('currentUser', data.username);
                localStorage.setItem('userId', data.userId);
                loginMessage.textContent = '登录成功';
                loginMessage.className = 'text-center mt-2 small text-success';
                window.location.href = '/products.html';
            } else {
                loginMessage.textContent = data.message || '登录失败';
                loginMessage.className = 'text-center mt-2 small text-danger';
            }
        } catch (error) {
            loginMessage.textContent = '网络错误，请稍后重试';
            loginMessage.className = 'text-center mt-2 small text-danger';
        }
    });
</script>
</body>
</html>
